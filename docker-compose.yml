version: "3.8"

services:
  tb-server:
    build:
      context: .
      dockerfile: Dockerfile.tb-server-4.0.1
    container_name: tb-server-4.0.1
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://172.17.0.1:5432/thingsboard
      - SPRING_DATASOURCE_USERNAME=nethmi
      - SPRING_DATASOURCE_PASSWORD=123456
      - TB_QUEUE_TYPE=in-memory
    restart: unless-stopped
