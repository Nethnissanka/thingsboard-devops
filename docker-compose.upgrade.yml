version: "3.8"

services:
  tb-upgrader:
    build:
      context: .
      dockerfile: Dockerfile-upgrade
    container_name: thingsboard-upgrader
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://172.17.0.1:5432/thingsboard1
      - SPRING_DATASOURCE_USERNAME=nethmi
      - SPRING_DATASOURCE_PASSWORD=123456
      - TB_QUEUE_TYPE=in-memory
    restart: "no"
